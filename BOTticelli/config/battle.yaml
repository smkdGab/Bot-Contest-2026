# Simulation practice rules, not confirmed contest equipment limits.
# SI units; attachment directions and pose yaw are degrees.
opponents: {min: 1, max: 5}
generation_attempts: 2000
arena:
  shapes: {rectangle: 1, convex: 1, l: 1}
  width: {min: 4, max: 6}
  height: {min: 4, max: 6}
  passage_min: 1
  wall_height: 0.35
  wall_thickness: 0.05
  obstacles: []
car:
  length: 0.30
  width: 0.20
  height: 0.20
  wheelbase: 0.20
  max_speed: 0.60
  speed_limit: 1
  max_steering_deg: 30
  # Multiple toothpicks are an unconfirmed practice setting. Set to 1 if needed.
  toothpick_count: {min: 1, max: 3}
  toothpick:
    length: {min: 0.08, max: 0.12}
    mount: perimeter        # front, rear, left, right, or all edges
    spread_deg: 30          # outward direction +/- this angle
    elevation_deg: 0
    height: 0.28
  balloon:
    mount: perimeter        # random edge and position along that edge
    radius: {min: 0.06, max: 0.08}
    clearance: 0.02
    height: 0.28
  sensors:
    x: 0.20
    y: 0
    height: 0.15
    camera_height: 0.28
    hz: 8
    minimum: 0.01
    maximum: 5
    horizontal_deg: 120
    camera_deg: 60
    noise_std: 0
    drop_probability: 0
    stale_seconds: 0.4
# Stable ID 0 is the player. Entries merge with shared car defaults.
cars: {}
# Example per-car override (starts must leave all attachments clear):
# cars:
#   '0':
#     pose: [1, 1, 90]    # rear axle x, y, yaw degrees
#     toothpick_count: 1
#     toothpicks:
#       - position: [0.25, 0, 0.28]
#         length: 0.10
#         direction_deg: 0
#         elevation_deg: 0
#     balloon:
#       position: [-0.15, 0, 0.28]
#       radius: 0.07
# An explicit polygon replaces generated shapes:
# arena:
#   polygon: [[0,0], [6,0], [6,2], [2,2], [2,6], [0,6]]
damage:
  health: 100
  minimum_speed: 0.10
  reference_speed: 0.50
  multiplier: 50
  separation: 0.02
